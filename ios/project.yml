name: Everywhy
options:
  bundleIdPrefix: com.everywhy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
targets:
  Everywhy:
    type: application
    platform: iOS
    sources:
      - Everywhy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everywhy.app
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Everywhy uses the camera to capture things you're curious about and explain why they exist."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Everywhy lets you pick a photo to identify and explain why it exists."
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_CFBundleDisplayName: "Everywhy"
